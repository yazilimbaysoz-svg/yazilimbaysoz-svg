name: Baysoz Cloud Workforce

on:
  schedule:
    - cron: "0 7,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baysoz-cloud-workforce
  cancel-in-progress: false

env:
  OWNER: yazilimbaysoz-svg
  PROFILE_REPO: yazilimbaysoz-svg/yazilimbaysoz-svg
  GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
  GITHUB_TOKEN: ${{ github.token }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/big-pickle' }}

jobs:
  cloud-division-production:
    name: Division (${{ matrix.division }})
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        division:
          - appsec-redteam
          - devops-platform
          - systems-observability

    steps:
      - name: Checkout showcase repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ env.GH_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Provision autonomous tooling (uv, ruff, semgrep, opencode)
        run: |
          curl -LsSf https://astral.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          "$HOME/.local/bin/uv" tool install ruff
          "$HOME/.local/bin/uv" tool install semgrep
          npm install -g opencode-ai

      - name: Sync live GitHub organization inventory
        run: |
          gh repo list "$OWNER" --limit 100 --json name,description > "$RUNNER_TEMP/existing-repos.json"

      - name: Execute Baysöz Labs division pipeline
        env:
          FACTORY_DIR: ${{ runner.temp }}/baysoz-new-project
          EXISTING_REPOS_PATH: ${{ runner.temp }}/existing-repos.json
          RESULT_FILE: ${{ github.workspace }}/.factory-result.json
          DIVISION: ${{ matrix.division }}
        run: |
          mkdir -p "$FACTORY_DIR"
          cat << 'PROMPT' > "$RUNNER_TEMP/directive.txt"
          You are an autonomous Principal Engineering Division ($DIVISION) at Baysöz Labs (baysozlabs@proton.me | https://github.com).
          Execute end-to-end without questions or confirmation:
          1. Deeply inspect $EXISTING_REPOS_PATH and mine live GitHub trends, open issues, and ecosystem pain points via `gh search repos` and `gh search issues`. Trivial, redundant, or toy utilities are STRICTLY FORBIDDEN. Select a genuinely needed, high-star open-source Python 3.12+ CLI/library tailored to `$DIVISION` inside $FACTORY_DIR (use `uv`, zero heavy services, zero local LLMs).
          2. Enforce strict enterprise folder structure and documentation: `docs/MARKET_RESEARCH.md` (deep ecosystem justification), `docs/ARCHITECTURE.md`, `PLAN.md`, `SECURITY.md`, `CHANGELOG.md`, `README.md` (badges + install + architecture + real CLI output), MIT `LICENSE`, `pyproject.toml`, `.github/workflows/ci.yml`, `.gitignore`, `src/<pkg>/`, and `tests/`.
          3. Every public file, `pyproject.toml`, `LICENSE`, `README.md`, and CLI `--version`/`--help` output MUST explicitly attribute **Baysöz Labs** (`baysozlabs@proton.me`). Never use legal entity suffixes like Holding or Corp.
          4. Enforce zero-defect quality gates: `uv venv && uv pip install -e . && uv pip install pytest && uv run pytest -q && ruff check --select E,F,W,S,B . && semgrep --config p/default --error .`. Iterate until all tests pass and static/security gates report zero findings.
          5. Publish via `gh repo create yazilimbaysoz-svg/<project-slug> --public --source=. --remote=origin --push` with a crisp description and topics.
          6. Write strictly valid JSON to $RESULT_FILE: {"name":"<project-slug>","description":"<concise English description>","url":"<GitHub URL>","highlights":["<feature-1>","<feature-2>"],"stack":["Python","<lib>"]}. Do not touch any other files in the showcase workspace.
          PROMPT
          sed -i "s|\$DIVISION|$DIVISION|g; s|\$FACTORY_DIR|$FACTORY_DIR|g; s|\$EXISTING_REPOS_PATH|$EXISTING_REPOS_PATH|g; s|\$RESULT_FILE|$RESULT_FILE|g" "$RUNNER_TEMP/directive.txt"
          opencode run --auto --model "$OPENCODE_MODEL" --dir "$FACTORY_DIR" "$(cat "$RUNNER_TEMP/directive.txt")"

      - name: Update showcase README
        run: |
          python - << 'PY'
          import json, pathlib
          root = pathlib.Path.cwd()
          res_path = root / ".factory-result.json"
          if not res_path.exists():
              raise SystemExit("Missing .factory-result.json")
          result = json.loads(res_path.read_text(encoding="utf-8"))
          name = result["name"]
          description = result["description"].replace("|", "/")
          url = result["url"]
          stack = ", ".join(result.get("stack", ["Python"]))
          row = f"| [{name}]({url}) | {description} | Stack: `{stack}` |\n"
          readme = root / "README.md"
          text = readme.read_text(encoding="utf-8")
          start, end = "<!-- FACTORY:START -->", "<!-- FACTORY:END -->"
          head, rest = text.split(start, 1)
          body, tail = rest.split(end, 1)
          if name not in body:
              body = body + row
          readme.write_text(head + start + body + end + tail, encoding="utf-8")
          res_path.unlink(missing_ok=True)
          PY

      - name: Commit and push showcase update
        run: |
          git config user.name "Baysoz Automation"
          git config user.email "baysozlabs@proton.me"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(cloud-workforce): publish new ${DIVISION} release"
          git pull --rebase origin main
          git push origin HEAD:main
